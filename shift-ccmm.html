<script>

  zeroPts.forEach(p=>{
    if(p[0]===3&&p[1]===5) dot(left,p[0],p[1],'#1687d4',14);
    else if(p[0]===5&&p[1]===1) dot(left,p[0],p[1],'#7e45b8',14);

  });
  zero2Pts.forEach(p=>dot(right,p[0],p[1]));
  const orderedPaths=[zeroPts,zero2Pts].map(pts=>{
    const minX=Math.min(...pts.map(p=>p[0])),maxX=Math.max(...pts.map(p=>p[0]));
    const minY=Math.min(...pts.map(p=>p[1])),maxY=Math.max(...pts.map(p=>p[1]));

    const rightSide=pts.filter(p=>p[0]===maxX&&p[1]!==maxY).sort((a,b)=>b[1]-a[1]);

  const nodeGroups=[left,right];
  const nodes=nodeGroups.map(group=>[...group.querySelectorAll('circle[data-movable]')]);
  const blueIndex=zeroPts.findIndex(([x,y])=>x===3&&y===5);
  const purpleIndex=zeroPts.findIndex(([x,y])=>x===5&&y===1);
  function addName(text,color){const t=document.createElementNS(NS,'text');t.textContent=text;t.setAttribute('fill',color);names.appendChild(t);return t}

  function drawRouteFor(startPhase,color,markerId,side,distance,sign){

    const path=paths[0],n=path.length,cx=(Math.min(...path.map(p=>p.x))+Math.max(...path.map(p=>p.x)))/2,cy=(Math.min(...path.map(p=>p.y))+Math.max(...path.map(p=>p.y)))/2,offset=20;

    drawRouteFor(pointIndexMaps[0][blueIndex]+routeStartProgress*paths[0].length,'#75b8e8','routeArrowBlue','inside',distance,sign);
  }
  function render(){
    updateRouteTracks();
    paths.forEach((path,g)=>nodes[g].forEach((node,i)=>{const pi=pointIndexMaps[g][i],pos=pointAt(path,pi,progress*path.length);node.setAttribute('cx',pos.x);node.setAttribute('cy',pos.y)}));
    const bluePos=pointAt(paths[0],pointIndexMaps[0][blueIndex],progress*paths[0].length);
    const purplePos=pointAt(paths[0],pointIndexMaps[0][purpleIndex],progress*paths[0].length);
    blueName.setAttribute('x',bluePos.x);blueName.setAttribute('y',bluePos.y-27);purpleName.setAttribute('x',purplePos.x);purpleName.setAttribute('y',purplePos.y-27);

  }
